services:
  llm:
    image: ollama/ollama:0.40.15
    profiles: [ai]
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: 5m
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tractor
      POSTGRES_USER: tractor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tractor -d tractor']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - '127.0.0.1:${APP_PORT:-8000}:8000'
    environment:
      PGHOST: db
      PGDATABASE: tractor
      PGUSER: tractor
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      DATA_PATH: /app/data/supply_chain.csv
      MOCK_DATA_PATH: /app/data/supply_chain_mock_2024_2026.csv
      FRONTEND_PATH: /app/frontend/dist
      LLM_BASE_URL: ${LLM_BASE_URL-http://llm:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:1.7b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  postgres_data:
  ollama_models:


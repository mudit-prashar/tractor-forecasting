services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tractor
      POSTGRES_USER: tractor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tractor -d tractor']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - '127.0.0.1:${APP_PORT:-8000}:8000'
    environment:
      PGHOST: db
      PGDATABASE: tractor
      PGUSER: tractor
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      DATA_PATH: /app/data/supply_chain.csv
      FRONTEND_PATH: /app/frontend/dist
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  postgres_data:

